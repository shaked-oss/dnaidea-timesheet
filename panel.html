<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פאנל מכירות — DNAidea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF7F0; --card:#FFFFFF; --ink:#212B24; --ink-soft:#3E4A41;
  --muted:#948F7F; --line:#E3DCC9; --accent:#3D6656; --accent-dark:#2B4A3E;
  --accent-warm:#C98A46; --danger:#B5533D;
  --shadow: 0 1px 2px rgba(33,43,36,0.04), 0 8px 24px rgba(33,43,36,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: radial-gradient(circle at 15% 8%, rgba(61,102,86,0.05), transparent 40%), var(--paper);
  color:var(--ink); font-family:'Heebo', sans-serif; min-height:100vh;
}
.mono{ font-family:'IBM Plex Mono', monospace; }
/* ---- lock screen ---- */
#lockScreen{ position:fixed; inset:0; background:var(--paper); z-index:500; display:flex; align-items:center; justify-content:center; padding:20px; }
.lock-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px 28px; max-width:340px; width:100%; text-align:center; box-shadow:var(--shadow); }
.lock-card .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.14em; color:var(--accent); text-transform:uppercase; margin-bottom:8px; }
.lock-card h2{ font-family:'Frank Ruhl Libre', serif; font-size:20px; margin:0 0 18px; }
.lock-card input{ width:100%; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:15px; text-align:center; margin-bottom:12px; outline:none; font-family:'IBM Plex Mono',monospace; letter-spacing:0.2em; }
.lock-card input:focus{ border-color:var(--accent); }
.lock-card button{ width:100%; background:var(--accent-dark); color:#fff; border:none; border-radius:10px; padding:12px; font-weight:700; font-size:14px; cursor:pointer; }
.lock-card button:hover{ background:var(--accent); }
.lock-err{ color:var(--danger); font-size:12.5px; margin-top:10px; display:none; }
/* ---- app shell ---- */
#app{ display:none; max-width:1500px; margin:0 auto; padding:24px 20px 60px; }
.topbar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:20px; }
.eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.14em; color:var(--accent); text-transform:uppercase; display:flex; align-items:center; gap:8px; }
.eyebrow::before{ content:""; width:6px;height:6px;border-radius:50%; background:var(--accent); display:inline-block; }
h1{ font-family:'Frank Ruhl Libre', serif; font-weight:700; font-size:26px; margin:6px 0 0; }
.btn{ background:var(--accent-dark); color:#fff; border:none; border-radius:9px; padding:9px 16px; font-weight:600; font-size:12.5px; cursor:pointer; }
.btn:hover{ background:var(--accent); }
.btn.secondary{ background:#FCFAF5; color:var(--accent-dark); border:1px solid var(--line); }
.summary-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
.stat-chip{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 14px; font-size:12px; color:var(--ink-soft); box-shadow:var(--shadow); }
.stat-chip b{ font-family:'IBM Plex Mono',monospace; color:var(--ink); font-size:14px; display:block; margin-top:2px; }
.loading{ text-align:center; padding:60px 20px; color:var(--muted); font-size:13px; }
/* ---- kanban ---- */
.board{ display:flex; gap:14px; overflow-x:auto; padding-bottom:12px; align-items:flex-start; }
.col{ background:#F1EEE3; border-radius:14px; padding:10px; min-width:260px; max-width:260px; flex-shrink:0; }
.col-head{ display:flex; align-items:center; justify-content:space-between; padding:6px 8px 12px; }
.col-head .name{ font-weight:700; font-size:12.5px; }
.col-head .count{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); background:var(--card); border-radius:20px; padding:2px 8px; }
.col-body{ display:flex; flex-direction:column; gap:8px; min-height:80px; }
.col-body.drag-over{ background:rgba(61,102,86,0.08); border-radius:10px; }
.card-item{ background:var(--card); border:1px solid var(--line); border-right:3px solid var(--accent); border-radius:10px; padding:11px 12px; box-shadow:var(--shadow); cursor:grab; font-size:12.5px; line-height:1.5; }
.card-item.dragging{ opacity:0.4; }
.card-item .lead-name{ font-weight:700; font-size:13px; margin-bottom:6px; }
.card-item .lead-meta{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.card-item .tag{ font-size:10px; font-weight:600; padding:2px 7px; border-radius:20px; background:#EDF3F0; color:var(--accent-dark); }
.card-item .tag.budget{ background:#FBF0E2; color:var(--accent-warm); }
.card-item .tag.followup{ background:#F3E5E1; color:var(--danger); }
.card-item .owner{ color:var(--muted); font-size:11px; }
.archive-btn{ display:none; margin-top:8px; width:100%; background:#FCFAF5; border:1px solid var(--line); border-radius:7px; padding:5px 0; font-size:10.5px; color:var(--muted); cursor:pointer; }
.card-item:hover .archive-btn{ display:block; }
.archive-btn:hover{ background:#F3E5E1; color:var(--danger); border-color:var(--danger); }
.archive-row{ padding:10px 12px; border:1px solid var(--line); border-radius:9px; margin-bottom:6px; background:#FCFAF5; }
.archive-row .name{ font-weight:700; font-size:13px; margin-bottom:4px; }
.archive-row .meta{ font-size:11px; color:var(--muted); display:flex; gap:8px; flex-wrap:wrap; }
.empty-col{ text-align:center; color:var(--muted); font-size:11px; padding:14px 4px; }
.footnote{ margin-top:20px; text-align:center; font-size:11px; color:var(--muted); line-height:1.6; }
/* ---- modals ---- */
.modal-bg{ position:fixed; inset:0; background:rgba(33,43,36,0.45); display:none; align-items:center; justify-content:center; z-index:200; padding:20px; }
.modal-bg.open{ display:flex; }
.modal{ background:var(--card); border-radius:16px; padding:22px 22px 18px; max-width:420px; width:100%; max-height:85vh; overflow-y:auto; box-shadow:var(--shadow); }
.modal h3{ font-family:'Frank Ruhl Libre',serif; font-size:17px; margin:0 0 14px; }
.field-row{ margin-bottom:12px; }
.field-row label{ display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px; }
.field-row input, .field-row select{ width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 11px; font-size:13px; font-family:'Heebo',sans-serif; outline:none; }
.field-row input:focus, .field-row select:focus{ border-color:var(--accent); }
.modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
.col-manage-row{ display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--line); border-radius:9px; margin-bottom:6px; background:#FCFAF5; }
.col-manage-row .stage-name{ flex:1; font-size:13px; font-weight:600; }
.col-manage-row .lead-count{ font-size:10.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }
.col-manage-row button{ background:none; border:none; cursor:pointer; font-size:14px; color:var(--muted); padding:2px 6px; }
.col-manage-row button:hover{ color:var(--accent-dark); }
.col-manage-row button.remove:hover{ color:var(--danger); }
@media (max-width: 720px){
  h1{ font-size:21px; }
}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-card">
    <div class="eyebrow">DNAidea · פאנל מכירות</div>
    <h2>גישה מוגבלת</h2>
    <input type="password" id="pwInput" placeholder="סיסמה" maxlength="30">
    <button id="pwBtn">כניסה</button>
    <div class="lock-err" id="pwErr">סיסמה שגויה, נסה שוב</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div>
      <div class="eyebrow">DNAidea · פאנל מכירות</div>
      <h1>לידים ופרויקטים בתהליך</h1>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn secondary" id="manageColsBtn">⚙ נהל עמודות</button>
      <button class="btn" id="newLeadBtn">+ ליד חדש</button>
      <button class="btn secondary" id="viewArchiveBtn">📁 ארכיון</button>
      <button class="btn secondary" id="refreshBtn">⟳ רענון</button>
    </div>
  </div>

  <div class="summary-row" id="summaryRow"></div>

  <div id="boardWrap">
    <div class="loading" id="loadingMsg">טוען נתונים…</div>
    <div class="board" id="board" style="display:none"></div>
  </div>

  <div class="footnote">גרור כרטיס בין עמודות כדי לעדכן את השלב — העדכון נשמר ישירות ב-Sheet ונרשם ביומן הפעילות.</div>
</div>

<!-- NEW LEAD MODAL -->
<div class="modal-bg" id="newLeadModalBg">
  <div class="modal">
    <h3>ליד חדש</h3>
    <div class="field-row"><label>שם הליד *</label><input type="text" id="nlName" placeholder="שם הפרויקט / הליד"></div>
    <div class="field-row"><label>בעלים</label><input type="text" id="nlOwner" placeholder="שם העובד האחראי"></div>
    <div class="field-row"><label>שלב</label><select id="nlStatus"></select></div>
    <div class="field-row"><label>היקף תקציבי</label><input type="text" id="nlBudget" placeholder="לדוגמה 50-100K"></div>
    <div class="field-row"><label>סיכוי זכייה</label><input type="text" id="nlWinProb" placeholder="Low / Medium / High"></div>
    <div class="field-row"><label>פולו-אפ</label><input type="date" id="nlFollowUp"></div>
    <div class="field-row"><label>הערות</label><input type="text" id="nlNotes"></div>
    <div class="modal-actions">
      <button class="btn secondary" id="nlCancelBtn">ביטול</button>
      <button class="btn" id="nlSaveBtn">✓ הוסף ליד</button>
    </div>
  </div>
</div>

<!-- MANAGE COLUMNS MODAL -->
<div class="modal-bg" id="colsModalBg">
  <div class="modal">
    <h3>ניהול עמודות (שלבים)</h3>
    <div id="colsList"></div>
    <div class="field-row" style="margin-top:12px"><label>הוספת שלב חדש</label>
      <div style="display:flex;gap:6px">
        <input type="text" id="newColName" placeholder="שם השלב החדש" style="flex:1">
        <button class="btn secondary" id="addColBtn">+ הוסף</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" id="colsCancelBtn">ביטול</button>
      <button class="btn" id="colsSaveBtn">✓ שמור שינויים</button>
    </div>
  </div>
</div>

<!-- VIEW ARCHIVE MODAL -->
<div class="modal-bg" id="archiveModalBg">
  <div class="modal" style="max-width:560px">
    <h3>ארכיון לידים</h3>
    <div id="archiveList" style="max-height:60vh;overflow-y:auto"></div>
    <div class="modal-actions">
      <button class="btn secondary" id="archiveCloseBtn">סגור</button>
    </div>
  </div>
</div>


<script>
const BACKEND_URL = "https://script.google.com/a/macros/dnaidea.co.il/s/AKfycbzqgObQSV0MwWo9JWMr6u19gAWxsRwaxHcirAud76XXc-ynceuNRBW3NTTwOFxxE096dQ/exec";
const ADMIN_PASSWORD = "dnaidea2026"; // נוחות בלבד, לא אבטחה אמיתית

let STAGES = [
  { id: 'פיתוח עסקי/שת"פים', name: 'פיתוח עסקי / שת״פים' },
  { id: 'חם', name: 'חם' },
  { id: 'פושר', name: 'פושר' },
  { id: 'פוטנציאל', name: 'פוטנציאל' },
  { id: 'באוויר', name: 'באוויר' },
]; // ברירת מחדל — יוחלף בטעינה מהשרת

async function loadStages(){
  try {
    const res = await fetch(`${BACKEND_URL}?action=getStages`);
    const data = await res.json();
    if(Array.isArray(data) && data.length){
      STAGES = data.map(name => ({ id: name, name: name }));
    }
  } catch(err){
    console.warn('לא הצלחתי לטעון שלבים מהשרת, משתמש בברירת מחדל', err);
  }
}

// ---- lock screen ----
document.getElementById('pwBtn').onclick = tryUnlock;
document.getElementById('pwInput').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
async function tryUnlock(){
  const val = document.getElementById('pwInput').value;
  if(val === ADMIN_PASSWORD){
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    await loadStages();
    loadLeads();
  } else {
    document.getElementById('pwErr').style.display = 'block';
  }
}

let leads = [];
let draggedLeadName = null;

function fmtDate(s){
  if(!s) return '';
  const d = new Date(s);
  if(isNaN(d.getTime())) return '';
  return d.toLocaleDateString('he-IL', { day:'numeric', month:'numeric' });
}

async function loadLeads(){
  document.getElementById('loadingMsg').style.display = 'block';
  document.getElementById('board').style.display = 'none';
  try {
    const res = await fetch(`${BACKEND_URL}?action=getLeads`);
    const data = await res.json();
    if(!Array.isArray(data)) throw new Error(data.error || 'שגיאה בטעינה');
    leads = data;
    renderBoard();
    renderSummary();
    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('board').style.display = 'flex';
  } catch(err){
    console.error(err);
    document.getElementById('loadingMsg').textContent = 'שגיאה בטעינת נתונים — נסה שוב.';
  }
}

function renderSummary(){
  const row = document.getElementById('summaryRow');
  row.innerHTML = `
    <div class="stat-chip">סה"כ לידים<b>${leads.length}</b></div>
    ${STAGES.map(s => `<div class="stat-chip">${s.name}<b>${leads.filter(l=>l.status===s.id).length}</b></div>`).join('')}
  `;
}

function renderBoard(){
  const board = document.getElementById('board');
  board.innerHTML = STAGES.map(stage => {
    const stageLeads = leads.filter(l => l.status === stage.id);
    return `
      <div class="col">
        <div class="col-head">
          <span class="name">${stage.name}</span>
          <span class="count mono">${stageLeads.length}</span>
        </div>
        <div class="col-body" data-stage="${stage.id}">
          ${stageLeads.length ? stageLeads.map(l => `
            <div class="card-item" draggable="true" data-name="${l.name.replace(/"/g,'&quot;')}">
              <div class="lead-name">${l.name}</div>
              ${l.owner ? `<div class="owner">👤 ${l.owner}</div>` : ''}
              <div class="lead-meta">
                ${l.budget ? `<span class="tag budget">${l.budget}</span>` : ''}
                ${l.winProb ? `<span class="tag">${l.winProb}</span>` : ''}
                ${l.followUp ? `<span class="tag followup">⏰ ${fmtDate(l.followUp)}</span>` : ''}
              </div>
              <button class="archive-btn" data-name="${l.name.replace(/"/g,'&quot;')}" title="העבר לארכיון">🗄 ארכב</button>
            </div>
          `).join('') : '<div class="empty-col">אין לידים</div>'}
        </div>
      </div>
    `;
  }).join('');

  board.querySelectorAll('.card-item').forEach(el => {
    el.addEventListener('dragstart', () => {
      draggedLeadName = el.dataset.name;
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      draggedLeadName = null;
    });
  });

  board.querySelectorAll('.col-body').forEach(colBody => {
    colBody.addEventListener('dragover', (e) => {
      e.preventDefault();
      colBody.classList.add('drag-over');
    });
    colBody.addEventListener('dragleave', () => {
      colBody.classList.remove('drag-over');
    });
    colBody.addEventListener('drop', async (e) => {
      e.preventDefault();
      colBody.classList.remove('drag-over');
      if(!draggedLeadName) return;
      const newStatus = colBody.dataset.stage;
      const lead = leads.find(l => l.name === draggedLeadName);
      if(!lead || lead.status === newStatus) return;
      const oldStatus = lead.status;
      lead.status = newStatus; // optimistic update
      renderBoard();
      renderSummary();
      try {
        const res = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action:'updateLeadStatus', name: lead.name, newStatus, owner: lead.owner })
        });
        const result = await res.json();
        if(result.error) throw new Error(result.error);
      } catch(err){
        console.error('עדכון סטטוס נכשל', err);
        lead.status = oldStatus; // revert on failure
        renderBoard();
        renderSummary();
        alert('עדכון הסטטוס נכשל — נסה שוב.');
      }
    });
  });
}

document.getElementById('refreshBtn').onclick = loadLeads;

// ---- NEW LEAD ----
const newLeadModalBg = document.getElementById('newLeadModalBg');
document.getElementById('newLeadBtn').onclick = () => {
  document.getElementById('nlName').value = '';
  document.getElementById('nlOwner').value = '';
  document.getElementById('nlBudget').value = '';
  document.getElementById('nlWinProb').value = '';
  document.getElementById('nlFollowUp').value = '';
  document.getElementById('nlNotes').value = '';
  const sel = document.getElementById('nlStatus');
  sel.innerHTML = STAGES.map(s => `<option value="${s.id.replace(/"/g,'&quot;')}">${s.name}</option>`).join('');
  newLeadModalBg.classList.add('open');
};
document.getElementById('nlCancelBtn').onclick = () => newLeadModalBg.classList.remove('open');
newLeadModalBg.onclick = (e) => { if(e.target===newLeadModalBg) newLeadModalBg.classList.remove('open'); };
document.getElementById('nlSaveBtn').onclick = async () => {
  const name = document.getElementById('nlName').value.trim();
  if(!name){ alert('חובה להזין שם ליד'); return; }
  const btn = document.getElementById('nlSaveBtn');
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = 'שומר…';
  try {
    const res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'addLead',
        name,
        owner: document.getElementById('nlOwner').value.trim(),
        status: document.getElementById('nlStatus').value,
        budget: document.getElementById('nlBudget').value.trim(),
        winProb: document.getElementById('nlWinProb').value.trim(),
        followUp: document.getElementById('nlFollowUp').value,
        notes: document.getElementById('nlNotes').value.trim(),
      })
    });
    const result = await res.json();
    if(result.error) throw new Error(result.error);
    newLeadModalBg.classList.remove('open');
    await loadLeads();
  } catch(err){
    console.error('הוספת ליד נכשלה', err);
    alert('הוספת הליד נכשלה — נסה שוב.');
  } finally {
    btn.disabled = false; btn.textContent = original;
  }
};

// ---- MANAGE COLUMNS ----
const colsModalBg = document.getElementById('colsModalBg');
let pendingStages = [];
function renderColsList(){
  const container = document.getElementById('colsList');
  container.innerHTML = pendingStages.map((s, idx) => {
    const count = leads.filter(l => l.status === s.id).length;
    return `
    <div class="col-manage-row" data-idx="${idx}">
      <span class="stage-name">${s.name}</span>
      <span class="lead-count">${count} לידים</span>
      <button class="move-up" data-idx="${idx}" ${idx===0?'disabled style="opacity:.3"':''}>▲</button>
      <button class="move-down" data-idx="${idx}" ${idx===pendingStages.length-1?'disabled style="opacity:.3"':''}>▼</button>
      <button class="remove" data-idx="${idx}">✕</button>
    </div>`;
  }).join('');
  container.querySelectorAll('.move-up').forEach(b => b.onclick = () => {
    const i = parseInt(b.dataset.idx);
    if(i>0){ [pendingStages[i-1], pendingStages[i]] = [pendingStages[i], pendingStages[i-1]]; renderColsList(); }
  });
  container.querySelectorAll('.move-down').forEach(b => b.onclick = () => {
    const i = parseInt(b.dataset.idx);
    if(i<pendingStages.length-1){ [pendingStages[i+1], pendingStages[i]] = [pendingStages[i], pendingStages[i+1]]; renderColsList(); }
  });
  container.querySelectorAll('.remove').forEach(b => b.onclick = () => {
    const i = parseInt(b.dataset.idx);
    const count = leads.filter(l => l.status === pendingStages[i].id).length;
    if(count > 0){ alert(`אי אפשר למחוק את "${pendingStages[i].name}" — יש בו ${count} לידים. העבר אותם קודם לעמודה אחרת.`); return; }
    pendingStages.splice(i, 1);
    renderColsList();
  });
}
document.getElementById('manageColsBtn').onclick = () => {
  pendingStages = STAGES.map(s => ({ ...s }));
  renderColsList();
  colsModalBg.classList.add('open');
};
document.getElementById('colsCancelBtn').onclick = () => colsModalBg.classList.remove('open');
colsModalBg.onclick = (e) => { if(e.target===colsModalBg) colsModalBg.classList.remove('open'); };
document.getElementById('addColBtn').onclick = () => {
  const input = document.getElementById('newColName');
  const name = input.value.trim();
  if(!name) return;
  if(pendingStages.some(s => s.id === name)){ alert('שלב בשם הזה כבר קיים'); return; }
  pendingStages.push({ id: name, name: name });
  input.value = '';
  renderColsList();
};
document.getElementById('colsSaveBtn').onclick = async () => {
  if(!pendingStages.length){ alert('חייב להישאר לפחות שלב אחד'); return; }
  const btn = document.getElementById('colsSaveBtn');
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = 'שומר…';
  try {
    const res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'saveStages', stages: pendingStages.map(s => s.id) })
    });
    const result = await res.json();
    if(result.error) throw new Error(result.error);
    STAGES = pendingStages;
    colsModalBg.classList.remove('open');
    renderBoard();
    renderSummary();
  } catch(err){
    console.error('שמירת עמודות נכשלה', err);
    alert('שמירת השינויים נכשלה — נסה שוב.');
  } finally {
    btn.disabled = false; btn.textContent = original;
  }
};

// ---- ARCHIVE LEAD (wired after every renderBoard call) ----
function wireArchiveButtons(){
  document.querySelectorAll('.archive-btn').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const name = btn.dataset.name;
      if(!confirm(`להעביר את "${name}" לארכיון? הליד ייעלם מהלוח הפעיל.`)) return;
      btn.disabled = true;
      btn.textContent = 'מעביר…';
      try {
        const res = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'archiveLead', name })
        });
        const result = await res.json();
        if(result.error) throw new Error(result.error);
        await loadLeads();
      } catch(err){
        console.error('ארכוב נכשל', err);
        alert('ארכוב הליד נכשל — נסה שוב.');
        btn.disabled = false; btn.textContent = '🗄 ארכב';
      }
    };
  });
}
const _origRenderBoard = renderBoard;
renderBoard = function(){ _origRenderBoard(); wireArchiveButtons(); };

// ---- VIEW ARCHIVE ----
const archiveModalBg = document.getElementById('archiveModalBg');
document.getElementById('viewArchiveBtn').onclick = async () => {
  const list = document.getElementById('archiveList');
  list.innerHTML = '<div class="loading">טוען…</div>';
  archiveModalBg.classList.add('open');
  try {
    const res = await fetch(`${BACKEND_URL}?action=getArchivedLeads`);
    const data = await res.json();
    if(!Array.isArray(data)) throw new Error(data.error || 'שגיאה בטעינה');
    list.innerHTML = data.length ? data.map(l => `
      <div class="archive-row">
        <div class="name">${l.name}</div>
        <div class="meta">
          ${l.owner ? `<span>👤 ${l.owner}</span>` : ''}
          ${l.status ? `<span>שלב אחרון: ${l.status}</span>` : ''}
          ${l.budget ? `<span>${l.budget}</span>` : ''}
          ${l.archivedDate ? `<span>אורכב: ${fmtDate(l.archivedDate)}</span>` : ''}
        </div>
      </div>
    `).join('') : '<div class="empty-col">הארכיון ריק</div>';
  } catch(err){
    console.error(err);
    list.innerHTML = '<div class="empty-col">שגיאה בטעינת הארכיון.</div>';
  }
};
document.getElementById('archiveCloseBtn').onclick = () => archiveModalBg.classList.remove('open');
archiveModalBg.onclick = (e) => { if(e.target===archiveModalBg) archiveModalBg.classList.remove('open'); };
</script>
</body>
